<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkillCraft Technology — Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="nav-brand"><span class="mark">&lt;/&gt;</span> SkillCraft</a>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="contact.html">Contact</a></li>
    <li><a href="contact.html" class="nav-cta">Get started</a></li>
  </ul>

  <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>
</nav>

<main>
  <section class="hero" style="min-height:50vh;">
    <p class="eyebrow">Contact</p>
    <h1>Say <span class="accent">hello</span>.</h1>
    <p>Questions about this exercise or the rest of the set — send a note below.</p>
  </section>

  <section class="content">
    <form class="contact-form">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>
      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="What's on your mind?" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="justify-self:start;">Send message</button>
    </form>
  </section>
</main>

<footer class="site-footer">
  <span>© 2026 SkillCraft Technology</span>
  <span>Task 01 — Responsive Landing Page</span>
</footer>

<script src="script.js"></script>
</body>
</html>
